<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Photo Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
    transition: 0.3s;
}

header {
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    font-size: 15px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 20px 10px;
}

input, select, button {
    padding: 11px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
}

button:hover {
    opacity: 0.85;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 4px 15px #00000012;
    transition: transform 0.25s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    cursor: pointer;
    display: block;
}

.card-content {
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.card-content h3 {
    font-size: 16px;
}

.download {
    text-decoration: none;
    background: #00b894;
    color: white;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
}

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000e;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

#viewer img {
    max-width: 95%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 8px;
}

#close {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 32px;
    color: white;
    background: transparent;
}

body.dark {
    background: #151521;
    color: #f5f5f5;
}

body.dark .card {
    background: #252538;
    color: white;
}

body.dark input,
body.dark select {
    background: #252538;
    color: white;
    border-color: #444;
}

.empty {
    text-align: center;
    padding: 35px;
    display: none;
}

footer {
    text-align: center;
    padding: 25px;
    margin-top: 20px;
    color: #777;
}

@media (max-width: 500px) {
    header h1 {
        font-size: 25px;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding: 10px;
    }

    .card img {
        height: 150px;
    }

    .card-content {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h1>📸 My Photo Gallery</h1>
    <p>Discover and enjoy beautiful moments</p>
</header>

<div class="controls">
    <input type="search" id="search" placeholder="🔍 Search photos...">

    <select id="category">
        <option value="All">All Categories</option>
        <option value="Nature">Nature</option>
        <option value="City">City</option>
        <option value="Animals">Animals</option>
    </select>

    <button id="theme">🌙 Dark Mode</button>
</div>

<main>
    <div class="gallery" id="gallery"></div>
    <div class="empty" id="empty">No photos found.</div>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button id="close" aria-label="Close preview">✕</button>
    <img id="largeImage" src="" alt="Large photo preview">
</div>

<footer>
    <p>© 2026 My Photo Gallery | Made with ❤️</p>
</footer>

<script>
const photos = [
    {
        title: "Beautiful Mountains",
        category: "Nature",
        url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Green Forest",
        category: "Nature",
        url: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Ocean View",
        category: "Nature",
        url: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "City Lights",
        category: "City",
        url: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Modern City",
        category: "City",
        url: "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Cute Cat",
        category: "Animals",
        url: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Beautiful Dog",
        category: "Animals",
        url: "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=900&q=85"
    },
    {
        title: "Sunset",
        category: "Nature",
        url: "https://images.unsplash.com/photo-1472120435266-53107fd0c44a?auto=format&fit=crop&w=900&q=85"
    }
];

const gallery = document.getElementById("gallery");
const search = document.getElementById("search");
const category = document.getElementById("category");
const empty = document.getElementById("empty");
const viewer = document.getElementById("viewer");
const largeImage = document.getElementById("largeImage");

function renderGallery() {
    const term = search.value.toLowerCase();
    const selected = category.value;

    const filtered = photos.filter(photo =>
        photo.title.toLowerCase().includes(term) &&
        (selected === "All" || photo.category === selected)
    );

    gallery.innerHTML = "";

    filtered.forEach(photo => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        img.src = photo.url;
        img.alt = photo.title;
        img.loading = "lazy";
        img.addEventListener("click", () => {
            largeImage.src = photo.url;
            largeImage.alt = photo.title;
            viewer.style.display = "flex";
        });

        const content = document.createElement("div");
        content.className = "card-content";

        const title = document.createElement("h3");
        title.textContent = photo.title;

        const download = document.createElement("a");
        download.className = "download";
        download.href = photo.url;
        download.target = "_blank";
        download.rel = "noopener";
        download.textContent = "View Photo";

        content.append(title, download);
        card.append(img, content);
        gallery.appendChild(card);
    });

    empty.style.display = filtered.length ? "none" : "block";
}

search.addEventListener("input", renderGallery);
category.addEventListener("change", renderGallery);

document.getElementById("theme").addEventListener("click", () => {
    document.body.classList.toggle("dark");

    document.getElementById("theme").textContent =
        document.body.classList.contains("dark")
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";
});

document.getElementById("close").addEventListener("click", () => {
    viewer.style.display = "none";
    largeImage.src = "";
});

viewer.addEventListener("click", event => {
    if (event.target === viewer) {
        viewer.style.display = "none";
        largeImage.src = "";
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        viewer.style.display = "none";
        largeImage.src = "";
    }
});

renderGallery();
</script>

</body>
</html>
